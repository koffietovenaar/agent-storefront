name: Bug report
description: Report reproducible behavior that appears incorrect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private data, and unrelated logs before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
      placeholder: |
        1. Install …
        2. Run …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime and operating system
    validations:
      required: true
